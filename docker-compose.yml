version: '3.8'

services:
  iwa-node:
    build: .
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      JWT_SECRET: docker-demo-secret-change-me
      SESSION_SECRET: docker-session-secret-change-me
    volumes:
      - iwa-data:/app/data
      - iwa-logs:/app/logs
    depends_on:
      - smtp4dev
    restart: unless-stopped

  smtp4dev:
    image: rnwood/smtp4dev:v3
    ports:
      - "5000:80"
      - "25:25"
      - "143:143"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./etc/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - iwa-node
    restart: unless-stopped
    profiles: ["nginx"]

volumes:
  iwa-data:
  iwa-logs:
