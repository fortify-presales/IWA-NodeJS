
# Create GitHub Action Repository Variables for your version of the application:
#   FOD_URL                     - FoD Portal URL for your tenant (e.g. https://ams.fortify.com)
#   FOD_DEFAULT_OWNER           - The user id of the Application Owner (only needed if an application does not already exist)
#   FOD_DEFAULT_ASSESSMENT_TYPE - The default Assessment Type to use, e.g. "Static Assessment"
# Create GitHub Action Secrets for your version of the application:
#   FOD_CLIENT_ID should be an API Key obtained from your FoD tenant.
#   FOD_CLIENT_SECRET should be the secret for the API Key obtained for your FoD tenant.
# Helpful hints:
#   API Key credentials can be obtained from your FoD tenant, under Administration -> Settings -> API
#   It is recommended to create credentials with 'Security Lead' Role selected.
#   "Automated Audit preference" should be configured for the release's Static Scan Settings.
name: Fortify on Demand Scan

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  Fortify-AST-Scan:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
      pull-requests: write
      
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Create Fortify source package
        run: |
          zip -r fortifypackage.zip \
            packages \
            Dockerfile \
            docker-entrypoint.sh \
            package.json \
            package-lock.json \
            tsconfig.base.json \
            -x 'packages/**/dist/*'
          zip -T fortifypackage.zip
      # Perform Fortify on Demand SAST scan and import SAST results into GitHub code scanning alerts
      - name: Run FoD SAST+SCA Scan
        uses: fortify/github-action@v3
        env:
          FOD_URL: ${{ vars.FOD_URL }}
          FOD_CLIENT_ID: ${{secrets.FOD_CLIENT_ID}}
          FOD_CLIENT_SECRET: ${{secrets.FOD_CLIENT_SECRET}}
          DO_SETUP: true
          SETUP_EXTRA_OPTS: ${{ format('--sdlc-status Development --app-owner {0}', vars.FOD_DEFAULT_OWNER) }}
          USE_PACKAGE: fortifypackage.zip
          #PACKAGE_EXTRA_OPTS: -bt none -exclude "DEMO.md" -exclude "SECURITY.md" -exclude "packages/api/tests"
          SAST_ASSESSMENT_TYPE: ${{ vars.FOD_DEFAULT_ASSESSMENT_TYPE }}
          SAST_WAIT_EXTRA_OPTS: --timeout 3h
          DO_SAST_SCAN: true
          DO_SCA_SCAN: false # We are using Debricked GitHub App for this
          DO_AVIATOR_AUDIT: true
          DO_AVIATOR_REMEDIATIONS: ${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'demo/fortify-remediate' }}
          COPY_FROM_RELEASE: "${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.event.repository.default_branch }}"
          DO_WAIT: true
          DO_CHECK_POLICY: true
          DO_JOB_SUMMARY: true
          DO_PR_COMMENT: true
          DO_EXPORT: true
          # Use an absolute path (relative paths are resolved against fcli's cwd, not GITHUB_WORKSPACE)
          CHECK_POLICY_ACTION: ${{ github.workspace }}/.github/custom-actions/fod-check-policy.yaml
          CHECK_POLICY_EXTRA_OPTS: --on-unsigned=ignore --scan-types Static,OpenSource
