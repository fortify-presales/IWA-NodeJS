name: 'Deploy to Azure Web App'

on:
  #push:
  #  branches:
  #    - main
  #  paths-ignore:
  #    - '.github/**'
  #    - '!.github/workflows/deploy-azure.yml'
  workflow_dispatch:
  #schedule:
    # Nightly rebuild/redeploy so the running image reflects the latest security-tested main
  #  - cron: '0 3 * * *'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase repository name
        id: string
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update Azure Web App container image
        env:
          IMAGE: ${{ steps.string.outputs.IMAGE_NAME }}:${{ github.sha }}
        run: |
          az webapp config container set \
            --name "${{ secrets.AZURE_WEBAPP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --container-image-name "$IMAGE"
