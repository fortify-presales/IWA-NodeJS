name: Build and Test

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '.github/**'
      - '!.github/workflows/ci.yml'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '.github/**'
      - '!.github/workflows/ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run lint
