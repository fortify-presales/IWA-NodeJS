name: Build and Test

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '.github/**'
      - '!.github/workflows/ci.yml'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '.github/**'
      - '!.github/workflows/ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      NEXUS_REPO_NPM: ${{ vars.NEXUS_REPO_NPM || 'https://registry.npmjs.org/' }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
        env:
          NEXUS_REPO_AUTH: ${{ secrets.NEXUS_REPO_AUTH }}
      - run: npm run build
      - run: npm test
      - run: npm run lint

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        id: image
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          build-args: |
            NEXUS_REPO_NPM=${{ env.NEXUS_REPO_NPM }}
          secrets: |
            nexus_repo_auth=${{ secrets.NEXUS_REPO_AUTH }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.image.outputs.IMAGE_NAME }}:latest
            ${{ steps.image.outputs.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
