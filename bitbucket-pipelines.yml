image: node:20

pipelines:
  default:
    - step:
        name: Build and Test
        caches:
          - node
        script:
          - npm ci
          - npm run build
          - npm test
  branches:
    main:
      - step:
          name: Build, Test and Scan
          caches:
            - node
          script:
            - npm ci
            - npm run build
            - npm test
            - npm run lint
