trigger:
  branches:
    include: [ main, develop ]

pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'

  - script: npm ci
    displayName: Install dependencies

  - script: npm run build
    displayName: Build

  - script: npm test
    displayName: Test

  - script: npm run lint
    displayName: Lint

  - task: PublishTestResults@2
    condition: always()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: test-results/*.xml
